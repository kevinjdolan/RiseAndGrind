services:
  gcs:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-backend", "memory", "-port", "4443"]
    ports:
      - "4443:4443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4443/storage/v1/b"]
      interval: 2s
      timeout: 2s
      retries: 20

  seed:
    build: ./seed
    depends_on:
      gcs:
        condition: service_healthy
    environment:
      GCS_BASE_URL: http://gcs:4443
      GCS_BUCKET: rise-and-grind-music
      SCRATCH_ROOT: /data/scratch_data
      TMP_ROOT: /data/tmp
    volumes:
      - ../scratch_data:/data/scratch_data:ro
      - ../tmp:/data/tmp:ro

  app:
    build: ./app
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      GCS_PROXY_TARGET: http://gcs:4443
      VITE_GCS_BUCKET: rise-and-grind-music
    ports:
      - "5173:5173"
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules

volumes:
  app_node_modules:
